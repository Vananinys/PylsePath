name: PulsePath checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the same Flutter revision used for local builds
        shell: bash
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin refs/tags/3.47.7:refs/tags/3.47.7
          git -C "$RUNNER_TEMP/flutter" checkout -b stable abaf9c523780a608bd46686fd5e53740a07077f8
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: python3 tools/verify_publishable_sources.py
      - run: flutter pub get
      - name: Live trail stability and map layout
        run: flutter test --no-pub test/map_trail_stability_test.dart
      - name: Release channels, privacy and data integrity
        # Include bounded live-tail phase and independent appearance persistence.
        run: flutter test --no-pub test/app_release_test.dart test/release_channels_test.dart test/usage_statistics_test.dart test/update_privacy_screens_test.dart test/privacy_registration_test.dart test/deepseek_integrity test/workout_draft_store_test.dart test/history_integrity_test.dart test/upgrade_qa test/upgrade_safety_regression_test.dart test/trail_appearance_test.dart test/messenger_test.dart
      - name: Analyze release and counters code
        run: dart analyze lib/services/app_update_service.dart lib/services/usage_statistics.dart lib/screens/app_versions_screen.dart lib/screens/usage_statistics_screen.dart test/release_channels_test.dart test/usage_statistics_test.dart test/update_privacy_screens_test.dart lib/data/local_data_integrity.dart lib/data/trail_appearance.dart lib/widgets/activity_trail_layer.dart lib/screens/trail_appearance_screen.dart test/upgrade_safety_regression_test.dart test/trail_appearance_test.dart
